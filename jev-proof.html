# 用 Jev 取代 LLM 監聽：兩個星期訊息的證明

這個活躍的 AI 討論群，兩個星期累積 675 則訊息。如果照一般做法，讓一個大型模型直接監聽——每則訊息進來都問它一次「這需要 AI 回應嗎」——那就是 675 次完整的推理請求，而其中真正需要 AI 開口的時刻，事後數出來不到十個。絕大多數 token 花在維持沉默上。

規劃時 Ian 就想到另一條路，原話是：

> 我突然想到可以用 jev 監聽群裡面的談話，如果發現需要反應，就可以通知後面的 ai 做回應。

架構上的分工很清楚：Jev 是小而快的判斷模型，讀狀態、回機率，不生成文字，每次請求的負擔固定且小；貴的推理模型不必看著對話流，只在 Jev 說「該開口了」的那一刻醒來。省錢的關鍵不在換模型，在於把「持續注意」和「真正回答」分給不同成本的東西。

## 先算帳：兩種做法差多少

浪費是結構性的。監聽的意思是：每則發言進來，模型都要重讀一次完整上下文——自己的身份與規則、對話紀錄——675 則就是 675 次整包重送，錢大多花在「看完、決定不說話」的時刻。Jev 那側用實測數字計費：每次守門 1,147 個輸入 tokens（API 回報的用量，含它內部格式化），Jev 定價每百萬輸入 tokens 0.042 美元、輸出不計費，兩週守門層共約 96 萬 tokens（675 次守門，加上極少數問題的後續檢查），帳單 0.04 美元。LLM 那側沒有實測（手邊帳戶沒有餘額），用估算：以這個群實測的平均訊息大小（每則 28 tokens）、約 1,000 tokens 的規則提示、20 則對話窗口、每次輸出 150 tokens，套各模型公開牌價：

| 守門方式 | 兩週 | 一年 | 對 Jev 的倍數 |
|---|---|---|---|
| Jev（實測用量） | $0.04 | $1.05 | 1x |
| GPT-4o-mini（估算） | $0.22 | $5.7 | 5x |
| Kimi K2（估算） | $0.88 | $23 | 20x |
| Claude Haiku（估算） | $1.55 | $41 | 36x |
| Claude Sonnet（估算） | $4.66 | $122 | 109x |

整個架構合計：Jev 守門 $0.04，加叫醒 Sonnet 級模型回答約 $0.09（兩週只叫醒 5～6 次，這個次數怎麼來的，是後面兩節的內容），合計 $0.13；直接用 Sonnet 監聽是 $4.7，約 36 倍。這還只是這個群的量；差距隨規模拉開——顧更多群或更熱的群，Jev 是線性成長的幾毛錢，LLM 監聽是線性成長的幾十塊。牌價是查價當下的公開定價，以官網為準。

但這條路要成立，有一個前提必須先證明：**Jev 那層守門的判斷要夠準**。守門員亂放行，後面的推理模型照樣被叫醒，錢省不下來；守門員太緊，該開口的時刻錯過，AI 形同不在場。這篇記錄的，就是用那 675 則真實對話回測這個前提的過程和結果。

## 回測：先讓 Jev 把兩週跑一遍

回測的方法很直接：不先人工定義對錯，讓 Jev 把兩個星期全部跑一遍，看它眼裡這個群長什麼樣。掃描的單位是「時刻」——每則訊息進來之後的那一瞬間，連同前面八則對話一起交給 Jev，問三個是非題（題目與暫定門檻沿用最初的設計）：有人在點名小助手嗎？對話是不是停在自然空檔？此刻主動補話能加分嗎？它不答「是」或「否」，答的是把握程度：比如「自然空檔 0.8」，意思是它有八成把握認為是。兩個星期共 672 個時刻，每個時刻得到這樣一組分數，四分鐘左右全部跑完——同樣的量交給大型模型逐則判斷，時間和 token 都不是這個數量級。

把 672 組分數照題目分成兩排看，形狀非常極端。一排幾乎全滿：「自然空檔」在 99% 的時刻都超過 0.6——這個群隨時停著等人接話，插話的「機會」從來不缺。另一排幾乎全空：「補話加分」只有 4% 的時刻超過 0.6，兩個星期裡 Jev 給過的最高分是 0.68。

| | 自然空檔 | 補話加分 |
|---|---|---|
| 超過 0.6 的時刻 | 667／672（99%） | 24／672（4%） |
| 全部 672 個分數的中位數 | 0.79 | 0.46 |
| 兩週最高分 | 0.92 | 0.68 |

暫定門檻是「空檔 ≥0.6、且加分 ≥0.7 才開口」。加分那排的最高分 0.68 永遠夠不到 0.7——照這組數字，AI 兩週一句話都不會說；而把 0.7 往下修到 0.6，開口次數立刻從 0 跳到 24，再往下修就是一百多。門檻差 0.05，開口次數就差幾十次。

要附帶說明這些分數的性質：它們是 Jev 的判斷，不是事實；0.5 附近代表「是與否的把握相當」，不是「中等強度」。這兩排數字也只描述這個群、這兩週。

所以第一輪的結論不是「門檻設錯了」，而是更根本的：這個群不缺可以說話的時機，缺的是說了會加分的內容——「哪裡可以插話」這個問法，沒有對準真正的需要。

真正的問法是 Ian 接著問出來的：有沒有「沒有 AI 回話不行」的時刻——有人問了、但沒人答。這恰好是 Jev 型判斷最擅長的形狀：能不能變成明確的是非題。

## 證明的核心：Jev 分得出「該開口」的時刻嗎

掃描改成兩段：每則文字訊息先問「是不是期待回應的問題」，540 則中偵測到 98 個；再對每個問題連同後面八則訊息問「有沒有被實質回答」，53 個有人答、45 個沒有。45 個未答裡，人工讀完真正「AI 答了更好」的大約 7 個——掛了兩週的「Parse 是要付費的網站嗎」、「LINE 貼圖能轉到新帳號嗎」、還有明說「不知道（AI）會怎麼答覆我」卻沒有任何 AI 回他的那句。其餘是社交性的「大家有看過嗎」「求教」，本來就不該接。

然後是關鍵一測：不靠人工，Jev 自己挑得出這 7 個嗎？對 45 個未答問題補問第四個判斷「這是不是一個熟悉 AI 工具的成員答得了的類型」，結果 7 個接住 5 個，分數集中在 0.67～0.88；漏掉的 2 個，Jev 的拒絕有道理——一個要查群內文件（權限問題，不是判斷問題），一個字面上在問使用經驗（那是人的事）。誤判也摸清了來源：「有沒有人答」看錯的 8 個，有 3 個在十五分鐘內其實有人回，實際運作時等三十分鐘就自動解掉；真的誤報兩週約 3 個；同串重複觸發交給冷卻。

過程裡還有一個對架構重要的更正：把第一輪的「補話加分」分數疊進規則，反而漏掉兩個真正的時刻。「回答掛著的問題」和「主動插話」是兩種不同的開口，Jev 給兩者的分數本來就分得開——這其實是好消息：判斷模型知道自己在哪種情境裡。

## 守門規則

最後成型的守門規則：

> 新訊息進來 → Jev：這是問題嗎（≥0.6）→ 是則等 30 分鐘 → 沒人實質回答 → Jev：AI 答得了嗎（≥0.65）→ 通知後面的推理模型回答 → 冷卻 1 小時。

用兩週資料回推，這條規則叫醒推理模型 5～6 次，幾乎每次都對；對照直接監聽的 675 次完整推理，守門層把昂貴模型的負載壓到原來的百分之一以下，而守門本身是 675 次單題判斷加 143 次後續檢查——回傳只有幾個機率數字。開頭那筆帳的差距，就是這條規則把「每則都要完整推理」換成「極輕判斷＋少量後續檢查」的結果。

| 這一塊 | 現在有什麼 | 還缺什麼 |
|---|---|---|
| 守門準度 | 7 個該開口時刻接住 5 個；漏網屬能力缺口非判斷失誤 | 只在一個群、兩週資料上驗證 |
| 誤報控制 | 三種誤報來源都定位，等待＋冷卻可解大半 | 運作時的實際誤報率未實測 |
| 成本 | Jev 端實測：96 萬 tokens、$0.04（兩週）；監聽側估算已並列於開頭，假設明列 | LLM 端無實測；牌價隨時變動；實際帳單待上線核對 |
| 門檻 | 0.6／0.65 在這份資料上有效 | 可能過擬合，換群、換主題要重看 |
| 架構 | 「持續注意」與「真正回答」分層成立；兩種開口不混 | 通知後面推理模型的交接介面尚未實作 |

一個設計取捨要寫明白：讓 Jev 掃描等於把群對話內容送給外部判斷服務。這與上線後的運作相同，且內容不經過執行分析的 agent（掃描輸出只有數字）。這條界線是刻意選的。
