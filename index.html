<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown 分享</title>
<style>
  :root { --green: #06c755; --text: #1f1f1f; --muted: #6b6b6b; --bg: #fafaf7; --card: #ffffff; --line: #e5e5e0; --code: #f3f3f0; }
  @media (prefers-color-scheme: dark) {
    :root { --text: #f0f0f0; --muted: #a0a0a0; --bg: #16161a; --card: #22222a; --line: #34343c; --code: #2c2c34; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 16px 40px; font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif;
         background: var(--bg); color: var(--text); line-height: 1.6; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p.hint { color: var(--muted); margin: 0 0 16px; font-size: .92rem; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  textarea { width: 100%; min-height: 220px; padding: 10px 12px; font: 14px/1.5 ui-monospace, Menlo, monospace;
             color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 10px; resize: vertical; }
  button { width: 100%; margin-top: 20px; padding: 14px; font: inherit; font-weight: 700; color: #fff;
           background: var(--green); border: 0; border-radius: 12px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #status { margin-top: 14px; min-height: 1.6em; color: var(--muted); white-space: pre-wrap; }
  #preview { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px 14px; overflow-x: auto; }
  #preview table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  #preview th, #preview td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; }
  #preview code { background: var(--code); padding: 0 4px; border-radius: 4px; }
  #preview pre { background: var(--code); padding: 8px; border-radius: 8px; overflow-x: auto; }
  #preview blockquote { margin: 0; padding-left: 10px; border-left: 3px solid var(--line); color: var(--muted); }
  details { margin-top: 14px; color: var(--muted); font-size: .85rem; }
  details pre { white-space: pre-wrap; word-break: break-all; max-height: 240px; overflow: auto; }
</style>
</head>
<body>
<main>
  <h1>Markdown → LINE 卡片</h1>
  <p class="hint">貼上 Markdown，按分享後選擇對象。對方會直接在聊天室看到排版好的卡片（粗體、表格、清單等）。連結會列在卡片底部當按鈕；一段只有一個連結時，整段也可以點。</p>

  <label for="md">Markdown</label>
  <textarea id="md" autocomplete="off"># Paperclip：多 Agent 管理平台

影片：https://www.youtube.com/watch?v=7RVf25Rg0Mc

## 重點摘要

- **Meta-Harness 框架**：開源的多 Agent 管理平台，把 Claude Code、Codex、Hermes、Pi 及本地模型統整進同一個組織架構。
- **以任務為核心**：Agent 之間的溝通綁定在任務、子任務與層級回報線上，不是漫無目的的「Agent 聊天室」。
- **人類是董事會**：位於組織最頂層，核准 Agent 聘僱、裁決關鍵決策（Decisions）、處理升級回報的阻礙。
- **Artifacts 與 Routines**：產出（拓撲圖、報告、程式碼）集中留存追蹤；Routines 可排程健康檢查或每日立會（Standup）。

## 1. 痛點與解法

- **痛點**：同時用多套 Agent 時，難追蹤進度、釐清分工，跨 Agent 溝通與資安控管也困難。
- **解法**：把 Agent 變成公司裡的「員工」，有職稱、主管與明確職責。
- **實測場景**：NetworkChuck 的工作室「只要有人沖馬桶，NAS 就斷線」，用 Paperclip 組一個 AI IT 部門來排查。

## 2. 部署與組織

- **運行環境**：macOS、Linux、Windows WSL2，也可放 Proxmox 虛擬機或雲端 VPS。
- **聘僱流程**：新 Agent 要由人類以董事會身分按 Approve 才入職。

| 角色 | 名字 | 驅動 |
|---|---|---|
| CEO | Dumbledore | Claude Code |
| CTO | Ron | Hermes |
| 網路工程師 | Fred | Hermes |
| 儲存工程師 | George | Hermes |
| 系統架構 | Arthur Weasley | Codex |
| 資安審查 | Mad-Eye Moody | Codex |
| 網路掃描 | — | Pi |

## 3. 排查 NAS 斷線

1. **任務拆解**：人類把任務交給 CEO，CEO 建專案、拆子任務，分派給網路、儲存、資安專員。
2. **產出追蹤**：網路工程師自動登入交換器，產出網路拓撲報告，存進 Artifacts。
3. **決策互動**：需要人類確認時，Agent 主動提出決策單（例如是否執行受控測試）。
4. **排除項目**：NAS 當機、路由器死當、Spanning Tree 迴圈。

&gt; **真因**：MikroTik 交換器第 3、5、13、19 埠用了平價副廠 SFP 光纖模組，容錯率低。關門或機架震動時訊號瞬間中斷。**對策**：全面換成原廠規格 SFP。

## 4. 自動化與整合

- **Routines**：類似 Cron，定期巡檢儲存容量與健康度，異常時自動產生決策單；也能跑多 Agent 每日 Standup。
- **Flare 資安情資**：新增 Agent（Filch）串接 Flare API，監控暗網外洩憑證與竊資軟體紀錄。
- **組織匯出／匯入**：整個虛擬公司（Agent 配置、Routine、任務設定）可打包成 Blueprint 移轉。</textarea>

  <label>預覽（近似樣子，實際以 LINE 顯示為準）</label>
  <div id="preview"></div>

  <button id="share" disabled>分享卡片</button>
  <div id="status">載入中…</div>

  <details><summary>Flex JSON（除錯用）</summary><pre id="json"></pre></details>
  <p class="hint" style="margin-top:12px;text-align:center">版本 2026-09-25d</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  const LIFF_ID = "2011736396-qcyiLRJ3";

  const $ = (id) => document.getElementById(id);
  const status = (msg) => { $("status").textContent = msg; };

  // ---------- Markdown → Flex ----------
  const C = { text: "#222222", muted: "#777777", code: "#c7254e", link: "#1a73e8", codeBg: "#f3f3f0", quote: "#cccccc", head: "#f7f7f5", line: "#e5e5e5" };
  const HEAD_SIZE = { 1: "xl", 2: "lg", 3: "md", 4: "md", 5: "sm", 6: "sm" };

  // 行內 token → span 陣列
  function spans(tokens, style = {}) {
    const out = [];
    for (const t of tokens || []) {
      switch (t.type) {
        case "strong": out.push(...spans(t.tokens, { ...style, weight: "bold" })); break;
        case "em":     out.push(...spans(t.tokens, { ...style, style: "italic" })); break;
        case "del":    out.push(...spans(t.tokens, { ...style, decoration: "line-through" })); break;
        case "codespan": out.push({ ...style, text: unescape(t.text), color: C.code }); break;
        case "link": {
          const href = okUri(t.href) ? t.href : null;
          const linkText = plain(t.tokens) || t.href;
          if (href) links.push({ href, text: linkText });
          out.push(...spans(t.tokens, { ...style, color: C.link, decoration: "underline", _href: href || undefined }));
          break;
        }
        case "br":     out.push({ ...style, text: "\n" }); break;
        case "text":   if (t.tokens) out.push(...spans(t.tokens, style)); else out.push({ ...style, text: unescape(t.text) }); break;
        case "escape": out.push({ ...style, text: t.text }); break;
        default:       if (t.text) out.push({ ...style, text: unescape(t.text) });
      }
    }
    return out;
  }
  function unescape(s) {
    return String(s).replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'");
  }
  // Flex 的 uri 動作只接受 http(s)、line、tel
  function okUri(u) { return /^(https?:|line:|tel:)/i.test(u || ""); }

  // 目前這一塊內容裡出現的連結（toFlex 逐塊收集，最後放到卡片底部當按鈕）
  let links = [];

  // span 陣列 → Flex text 元件。整段只有一個連結時，讓整段可點。
  function textComp(sp, extra = {}) {
    const hrefs = [...new Set(sp.map(s => s._href).filter(Boolean))];
    const contents = sp.filter(s => s.text !== "").map(({ _href, ...s }) => ({ type: "span", ...s }));
    if (!contents.length) contents.push({ type: "span", text: " " });
    const comp = { type: "text", wrap: true, size: "sm", color: C.text, contents, ...extra };
    if (hrefs.length === 1) comp.action = { type: "uri", uri: hrefs[0] };
    return comp;
  }
  // 取純文字時不收集連結
  function plain(tokens) { const saved = links; links = []; const s = spans(tokens).map(s => s.text).join(""); links = saved; return s; }

  // 按鈕文字：連結文字就是網址時改顯示網域；上限 20 字
  function buttonLabel(l) {
    let t = l.text.trim();
    if (/^https?:\/\//i.test(t)) { try { t = new URL(t).hostname.replace(/^www\./, ""); } catch (e) {} }
    t = "🔗 " + t;
    return [...t].length > 20 ? [...t].slice(0, 19).join("") + "…" : t;
  }
  function linkFooter(list) {
    const seen = new Set(); const uniq = list.filter(l => !seen.has(l.href) && seen.add(l.href)).slice(0, 10);
    if (!uniq.length) return null;
    return { type: "box", layout: "vertical", spacing: "none", paddingAll: "8px",
      contents: uniq.map(l => ({ type: "button", style: "link", height: "sm",
        action: { type: "uri", label: buttonLabel(l), uri: l.href } })) };
  }

  // 區塊 token → Flex 元件陣列
  function blocks(tokens, depth = 0) {
    const out = [];
    for (const t of tokens) {
      switch (t.type) {
        case "heading":
          out.push(textComp(spans(t.tokens, { weight: "bold" }), { size: HEAD_SIZE[t.depth] || "md", margin: "lg" }));
          break;
        case "paragraph":
          out.push(textComp(spans(t.tokens), { margin: "md" }));
          break;
        case "text":
          out.push(textComp(spans(t.tokens || [{ type: "text", text: t.text }]), { margin: "sm" }));
          break;
        case "list":
          t.items.forEach((item, i) => {
            const bullet = t.ordered ? `${(t.start || 1) + i}.` : (depth ? "◦" : "•");
            const inner = blocks(item.tokens, depth + 1);
            out.push({ type: "box", layout: "horizontal", margin: "sm", paddingStart: depth ? "12px" : "0px", spacing: "sm",
              contents: [
                { type: "text", text: bullet, size: "sm", color: C.muted, flex: 0 },
                { type: "box", layout: "vertical", flex: 1, contents: inner.map(c => ({ ...c, margin: c.margin === "md" ? "none" : c.margin })) }
              ] });
          });
          break;
        case "table":
          out.push(table(t));
          break;
        case "code":
          out.push({ type: "box", layout: "vertical", margin: "md", backgroundColor: C.codeBg, cornerRadius: "6px", paddingAll: "8px",
            contents: [{ type: "text", text: t.text || " ", wrap: true, size: "xs", color: "#333333" }] });
          break;
        case "blockquote":
          out.push({ type: "box", layout: "horizontal", margin: "md", spacing: "md",
            contents: [
              { type: "box", layout: "vertical", width: "3px", backgroundColor: C.quote, contents: [{ type: "filler" }] },
              { type: "box", layout: "vertical", flex: 1, contents: blocks(t.tokens, depth).map(c => c.type === "text" ? { ...c, color: C.muted } : c) }
            ] });
          break;
        case "hr":
          out.push({ type: "separator", margin: "lg" });
          break;
        case "space": case "html": case "def": break;
        default:
          if (t.text) out.push(textComp([{ text: t.text }], { margin: "md" }));
      }
    }
    return out;
  }

  function table(t) {
    const align = (a) => a === "right" ? "end" : a === "center" ? "center" : "start";
    const row = (cells, head) => ({
      type: "box", layout: "horizontal", spacing: "sm", paddingTop: "4px", paddingBottom: "4px",
      paddingStart: "4px", paddingEnd: "4px", backgroundColor: head ? C.head : undefined,
      contents: cells.map((c, i) => textComp(spans(c.tokens, head ? { weight: "bold" } : {}),
        { flex: 1, size: "xs", align: align(t.align[i]) }))
    });
    const rows = [row(t.header, true)];
    t.rows.forEach(r => { rows.push({ type: "separator", color: C.line }); rows.push(row(r, false)); });
    // 移除 undefined 的 backgroundColor
    rows.forEach(r => { if (r.backgroundColor === undefined) delete r.backgroundColor; });
    return { type: "box", layout: "vertical", margin: "md", cornerRadius: "6px", borderWidth: "1px", borderColor: C.line, contents: rows };
  }

  // 太長時拆成多張泡泡（carousel），每張 JSON 控制在約 25KB 內
  function toFlex(md) {
    const tokens = marked.lexer(md);
    // 逐塊轉換，同時記下每塊裡的連結，拆卡片時連結跟著內容走
    const parts = [];
    for (const t of tokens) {
      links = [];
      const cs = blocks([t]);
      cs.forEach((c, i) => parts.push({ comp: c, links: i === cs.length - 1 ? links : [] }));
    }
    links = [];
    const comps = parts.map(p => p.comp);
    const bubbles = []; let cur = [];
    const size = (arr) => new TextEncoder().encode(JSON.stringify(arr.map(p => p.comp))).length;
    for (const p of parts) {
      if (cur.length && size(cur.concat(p)) > 24000) { bubbles.push(cur); cur = []; }
      cur.push(p);
    }
    if (cur.length) bubbles.push(cur);
    if (!bubbles.length) return null;
    if (bubbles.length > 12) throw new Error("內容太長，超過 12 張卡片的上限，請分次傳送。");
    const bubble = (ps) => {
      const contents = ps.map(p => p.comp);
      const b = { type: "bubble", size: "giga",
        body: { type: "box", layout: "vertical", paddingAll: "16px", contents: [{ ...contents[0], margin: "none" }, ...contents.slice(1)] } };
      const footer = linkFooter(ps.flatMap(p => p.links));
      if (footer) b.footer = footer;
      return b;
    };
    const plainText = comps.length ? md.replace(/[#*_`>|~-]/g, "").replace(/\s+/g, " ").trim() : "";
    return {
      type: "flex",
      altText: (plainText || "訊息").slice(0, 100),
      contents: bubbles.length === 1 ? bubble(bubbles[0]) : { type: "carousel", contents: bubbles.map(bubble) }
    };
  }

  function refresh() {
    const md = $("md").value;
    $("preview").innerHTML = marked.parse(md);
    try {
      const flex = toFlex(md);
      $("json").textContent = flex ? JSON.stringify(flex, null, 2) : "";
      return flex;
    } catch (e) { $("json").textContent = e.message; return null; }
  }

  // ---------- LIFF ----------
  async function main() {
    refresh();
    $("md").addEventListener("input", refresh);
    try { await liff.init({ liffId: LIFF_ID }); }
    catch (e) { status("LIFF 初始化失敗：" + e.message); return; }
    if (!liff.isInClient() && !liff.isLoggedIn()) { status("請在 LINE 裡打開這個頁面才能分享。預覽仍可使用。"); return; }
    if (!liff.isLoggedIn()) { liff.login(); return; }
    if (!liff.isApiAvailable("shareTargetPicker")) {
      status("這個環境不支援分享功能。請在 LINE 裡打開，並確認 LIFF 設定已開啟 Share target picker。"); return;
    }
    // 網址帶 ?f=名稱 時，改用事先放在 flex/ 資料夾的 Flex 卡片
    let preset = null;
    const f = new URLSearchParams(location.search).get("f");
    if (f && /^[a-z0-9-]+$/.test(f)) {
      try {
        const r = await fetch(`flex/${f}.json`, { cache: "no-store" });
        if (!r.ok) throw new Error(r.status);
        preset = await r.json();
        $("json").textContent = JSON.stringify(preset, null, 2);
        $("md").disabled = true;
        $("preview").textContent = `已載入預設卡片「${f}」，按分享即送出這張卡片（下方 Markdown 不會使用）。`;
      } catch (e) { status(`載入卡片「${f}」失敗：${e.message}`); return; }
    }
    $("share").disabled = false;
    status(preset ? `預設卡片：${f}` : "");
    $("share").addEventListener("click", async () => {
      let flex;
      try { flex = preset || toFlex($("md").value); } catch (e) { status(e.message); return; }
      if (!flex) { status("內容是空的。"); return; }
      $("share").disabled = true;
      try {
        const res = await liff.shareTargetPicker([flex]);
        status(res ? "已送出 ✅" : "已取消，沒有送出。");
      } catch (e) {
        status("分享失敗：" + e.message + "\n可展開下方 Flex JSON，貼到 LINE 的 Flex Message Simulator 檢查。");
      } finally {
        $("share").disabled = false;
      }
    });
  }
  main();
</script>
</body>
</html>
